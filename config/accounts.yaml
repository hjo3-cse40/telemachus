# Telemachus: Multi-Account Mailbox Configuration
# Accounts define the connection parameters; secrets are read from .env

accounts:
  # ----------------------------------------------------------------------------
  # 1. Yahoo Mail (Initial Test Account - Enabled)
  # ----------------------------------------------------------------------------
  - id: "yahoo"
    name: "Yahoo Mail"
    provider: "yahoo"
    email_env_var: "TELEMACHUS_MAIL_YAHOO_USER"
    pass_env_var: "TELEMACHUS_MAIL_YAHOO_PASS"
    enabled: true
    folders:
      inbox: "INBOX"
      drafts: "Drafts"
    poll_limit: 10

  # ----------------------------------------------------------------------------
  # 2. Gmail Account 1 (Placeholder - Change enabled to true once credentials added)
  # ----------------------------------------------------------------------------
  - id: "gmail_1"
    name: "Gmail (Personal)"
    provider: "gmail"
    email_env_var: "TELEMACHUS_MAIL_GMAIL1_USER"
    pass_env_var: "TELEMACHUS_MAIL_GMAIL1_PASS"
    enabled: false
    folders:
      inbox: "INBOX"
      drafts: "[Gmail]/Drafts"
    poll_limit: 10

  # ----------------------------------------------------------------------------
